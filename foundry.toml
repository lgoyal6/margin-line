[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 10_000
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/delegated-account/lib/openzeppelin-contracts-upgradeable/contracts/",
    "perpl-delegated-account/=lib/delegated-account/src/",
    "perpl-interfaces/=lib/delegated-account/interfaces/",
    "forge-std/=lib/forge-std/src/",
]

# Monad's contract size limit (128 KB) instead of Ethereum's 24 KB: MarketFactory relies on it.
code_size_limit = 131_072

fs_permissions = [{ access = "read-write", path = "./out" }, { access = "read-write", path = "./deployments" }, { access = "read", path = "./test/fixtures" }]

[profile.default.fuzz]
runs = 1_000

[profile.default.invariant]
runs = 256
depth = 64

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
monad_mainnet = "${MONAD_MAINNET_RPC}"

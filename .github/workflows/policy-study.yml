name: Offline policy study controls

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  policy-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r data/requirements.txt pytest==8.4.2
      - run: python -m pytest -q scorer/test_market_path.py scorer/test_policy_stress.py scorer/test_risk_validation.py scorer/test_wash_ring.py
